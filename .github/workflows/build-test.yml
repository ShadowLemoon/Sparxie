# 离线构建 + 全部测试。发布阻塞验收（实机六项）在 release 流程中单独执行。
name: build-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: 构建 native HoyoTouchCore
        shell: pwsh
        run: |
          $cmake = Get-ChildItem "C:/Program Files/Microsoft Visual Studio" -Recurse -Filter cmake.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'CMake\\CMake\\bin' } | Select-Object -First 1
          if (-not $cmake) { throw "未找到 VS 自带 cmake" }
          & $cmake.FullName -G "Visual Studio 18 2026" -A x64 -S native/HoyoTouchCore -B native/HoyoTouchCore/build
          if ($LASTEXITCODE -ne 0) { throw "native CMake 配置失败" }
          & $cmake.FullName --build native/HoyoTouchCore/build --config Release
          if ($LASTEXITCODE -ne 0) { throw "native 构建失败" }
          if (-not (Test-Path "native/HoyoTouchCore/build/Release/HoyoTouchCore.dll")) {
            throw "native 构建缺少 HoyoTouchCore.dll"
          }

      - name: 还原并构建
        run: dotnet build Sparxie.slnx -c Release --nologo

      - name: 下载并校验固定 ZZZ Runtime
        run: |
          python build/package_runtime.py download-runtime --destination zzz-runtime.zip
          python build/package_runtime.py prepare-runtime --archive zzz-runtime.zip --destination runtime/zzz

      - name: 复制 native DLL 到测试输出（HoyoAbi.Tests 冒烟）
        shell: pwsh
        run: |
          Copy-Item "native/HoyoTouchCore/build/Release/HoyoTouchCore.dll" "tests/HoyoAbi.Tests/bin/Release/net10.0/" -Force

      - name: 打包桌面应用（壳 + app-版本目录，含已校验 ZZZ Runtime）
        shell: pwsh
        run: ./build/package_desktop.ps1 -Version 0.0.0-ci -RuntimeDirectory runtime/zzz -OutputDirectory artifacts

      - name: 运行全部测试（含发布 ZIP 审计）
        run: dotnet test Sparxie.slnx -c Release --no-build --nologo -v q

      - name: 上传 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: sparxie-desktop
          path: artifacts/Sparxie-desktop-*-win-x64.zip
          retention-days: 14
