# 手动验证已发布的 ZZZ Runtime：固定 Release 下载、SHA-256 校验并上传 staging。
# 不参与 ZZZ-TouchRuntime 的发布 CI，也不使用仓库 Secret 或客户端凭据。
name: zzz-runtime-fetch

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 下载固定 Release 资产
        run: python build/package_runtime.py download-runtime --destination zzz-runtime.zip

      - name: 校验并准备 Runtime staging
        run: python build/package_runtime.py prepare-runtime --archive zzz-runtime.zip --destination runtime/zzz

      - name: 上传 staging 产物
        uses: actions/upload-artifact@v4
        with:
          name: zzz-runtime-staging
          path: runtime/zzz/
          retention-days: 7
